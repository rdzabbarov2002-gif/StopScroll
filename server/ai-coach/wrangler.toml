name = "stopscroll-ai-coach"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (never commit them):
#   npx wrangler@4 secret put OPENAI_API_KEY
#   npx wrangler@4 secret put APP_TOKEN        # optional, same value as EXPO_PUBLIC_AI_TOKEN
#
# Optional settings:
# [vars]
# Frequent, simple requests (entry analysis, phrasing) — an inexpensive model:
# OPENAI_MODEL_LIGHT = "gpt-5.4-nano"        # any model with Structured Outputs support
# OPENAI_EFFORT_LIGHT = "low"                # "off" for models without reasoning
# The rare deep analysis (about once a week per user) — a stronger model:
# OPENAI_MODEL_DEEP = "gpt-5.4-mini"
# OPENAI_EFFORT_DEEP = "medium"
# ALLOWED_ORIGIN = "https://your-web-app.example"
#
# Strongly recommended before going public (Workers Rate Limiting API):
# per client IP — the main limit, the client can't fake it.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
# Optional, stricter, per install id (on top of the IP limit).
# [[ratelimits]]
# name = "INSTALL_RATE_LIMITER"
# namespace_id = "1002"
# simple = { limit = 12, period = 60 }
# Also set a monthly budget for the project in the OpenAI dashboard.
