# Checks the deployed AI server with the requests the app itself sends (server/ai-coach/eval/
# smoke.json): entry analysis, deep analysis and memory translation, in Russian and English;
# "extended" sends 47 situations (smoke-extended.json). No key needed here — the server uses its
# own. Quick: a few cents; extended: about half a dollar.
# Run: Actions → Check AI server → Run workflow (the address defaults to the AI_URL variable).
name: Check AI server

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Server address (empty: the AI_URL repository variable)"
        required: false
      set:
        description: "quick — 6 requests, a few cents; extended — 47 situations, about $0.5"
        type: choice
        options: [quick, extended]
        default: quick
      only:
        description: "Only these request numbers, e.g. 37-47 (empty: all)"
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The app's own code reads the answers.
      - run: npm ci
      - name: Send the app's requests
        working-directory: server/ai-coach
        env:
          URL: ${{ inputs.url || vars.AI_URL }}
          AI_TOKEN: ${{ vars.AI_TOKEN }}
          SET: ${{ inputs.set == 'extended' && 'smoke-extended.json' || 'smoke.json' }}
          ONLY: ${{ inputs.only }}
        run: node --no-warnings --import ./eval/ts-hooks.mjs eval/smoke.mjs "$URL" "$SET" "$ONLY"
